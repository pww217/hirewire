# HireWire Local Development Docker Compose
# Usage: docker-compose up
#
# Services:
# - postgres  :5432  PostgreSQL 16, initialized from shared/schema.sql
# - web       :8000  FastAPI backend + compiled Vue 3 frontend + scraper scheduler

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hirewire
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: hirewire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirewire"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web application (API + frontend + scraper scheduler)
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://hirewire:localdev@postgres:5432/hirewire
      SCRAPE_SCHEDULE: "09:00,17:00"
      LOG_LEVEL: DEBUG
      LOG_FORMAT: console
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
