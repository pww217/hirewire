# HireWire Local Development Docker Compose
# Usage: docker-compose up
#
# This starts:
# - PostgreSQL database
# - Web app (API + frontend)
# - Scraper service (scheduled + on-demand HTTP triggers)
#
# The scraper service runs continuously on a schedule and exposes
# POST /trigger and POST /trigger/company/{id} for on-demand syncs.

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hirewire
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: hirewire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirewire"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web application (API + frontend)
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://hirewire:localdev@postgres:5432/hirewire
      SCRAPER_URL: http://scraper:8888
      LOG_LEVEL: DEBUG
      LOG_FORMAT: console
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Scraper service (always-on: scheduled + on-demand HTTP)
  scraper:
    build: .
    command: ["python", "-m", "scraper.src.server"]
    environment:
      DATABASE_URL: postgresql://hirewire:localdev@postgres:5432/hirewire
      SCRAPE_SCHEDULE: "09:00,17:00"
      LOG_LEVEL: DEBUG
      LOG_FORMAT: console
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
